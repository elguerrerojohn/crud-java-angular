spring.application.name=demo

# Carga variables desde un archivo .env (ignorado por git) si existe.
# Formato KEY=VALUE; se parsea como properties. 'optional' => no falla si no está.
spring.config.import=optional:file:./.env[.properties]

# PostgreSQL — los valores se pueden sobreescribir por variables de entorno.
# La contraseña NO tiene default: es obligatoria (no se commitea ninguna credencial).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tareas_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Seeder de datos de ejemplo (true por defecto; poner false para desactivarlo)
app.seed.enabled=true

# Server
server.port=8080
